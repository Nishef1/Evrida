# Requires the isolated Evrida QA native build (com.nishef.evrida.qa).
appId: com.nishef.evrida.qa
---
- launchApp:
    clearState: true
- assertVisible: 'EVRIDA'
- tapOn: 'Calendar'
- assertVisible: 'Calendar'
- tapOn: 'Boards'
- assertVisible: 'Boards'
- tapOn: 'Review'
- assertVisible: 'This week'
- tapOn: 'Plan'
- assertVisible: 'EVRIDA'
