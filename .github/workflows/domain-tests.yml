name: Domain tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test time and migration logic (no package install required)
        run: |-
          node scripts/check-test-budget.mjs
          node scripts/check-database-access.mjs
          node scripts/check-design-ssot.mjs
          node --experimental-strip-types --import ./tests/register-runtime.mjs --test tests/horizons.test.mjs tests/database.test.mjs tests/finance.test.mjs
