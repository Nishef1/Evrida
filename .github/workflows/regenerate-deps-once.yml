name: One-time Expo SDK dependency alignment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/regenerate-deps-once.yml"

permissions:
  contents: write

jobs:
  align:
    if: contains(github.event.head_commit.message, 'regenerate Expo SDK lockfile')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Align packages to the installed Expo SDK
        run: npx expo install --fix
      - name: Verify dependency alignment
        run: npm run deps:check
      - name: Verify TypeScript and domain tests
        run: |
          npm run typecheck
          npm run test:domain
      - name: Verify Android and iOS JavaScript bundles
        run: |
          npx expo export --platform android --output-dir /tmp/evrida-android-export
          npx expo export --platform ios --output-dir /tmp/evrida-ios-export
      - name: Commit regenerated package manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Expo reported no package manifest changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: align dependencies with Expo SDK 58"
          git push origin main
